<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1014">
  <script>(function(){try{var s=localStorage.getItem('jwv-theme');var pref=s||'dark';if(pref==='light'){document.documentElement.classList.add('paper');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#F6F4EF');}}catch(e){}})();</script>
  <meta name="robots" content="noindex">
  <title>Not Found — JWV Solutions</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/components/preloader.css">
  <link rel="stylesheet" href="/assets/css/components/header.css">
  <link rel="stylesheet" href="/assets/css/components/footer.css">
  <link rel="stylesheet" href="/assets/css/components/button.css">
  <link rel="stylesheet" href="/assets/css/pages/inner.css">
</head>
<body class="page-error">
  <div class="preloader" aria-hidden="true">
    <div class="preloader__panel preloader__panel--top"></div>
    <div class="preloader__panel preloader__panel--bottom"></div>
    <div class="preloader__stage">
      <div class="preloader__logo">
        <img class="preloader__img preloader__img--dark"  src="/assets/images/brand/logo-white.png" alt="" width="160" height="64">
        <img class="preloader__img preloader__img--light" src="/assets/images/brand/logo-black.png" alt="" width="160" height="64">
      </div>
      <div class="preloader__meter">
        <div class="preloader__line"><span class="preloader__line-fill"></span></div>
        <div class="preloader__count"><span class="preloader__count-num" data-count>0</span><span class="preloader__count-pct">%</span></div>
      </div>
    </div>
  </div>

  <header class="site-header" role="banner">
    <div class="site-header__inner">
      <a class="site-logo" href="/" aria-label="JWV Solutions home">
        <img class="site-logo__img site-logo__img--dark"  src="/assets/images/brand/logo-white.png" alt="" width="160" height="64" aria-hidden="true">
      <img class="site-logo__img site-logo__img--light" src="/assets/images/brand/logo-black.png" alt="" width="160" height="64" aria-hidden="true">
      </a>
      <nav class="site-nav" aria-label="Primary">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="/about.html">About</a></li>
        <li><a class="site-nav__link" href="/partnerships.html">Partnerships</a></li>
          <li><a class="site-nav__link" href="/contact.html">Contact</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation">
        <span class="nav-toggle__bars" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="error-page">
      <div class="error-page__inner reveal is-visible">
        <span class="error-page__code">404</span>
        <h1>The page you're looking for isn't here.</h1>
        <p style="color: var(--color-text-muted); max-width: 50ch;">It may have moved, or the link that brought you here may be broken. From here you can return home, learn about the group, or reach the operating company you're looking for.</p>
        <div class="hero-cta" style="margin-top: var(--space-4);">
          <a class="btn btn--primary" href="/">Return home</a>
          <a class="btn btn--ghost" href="/#companies">Our companies</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
