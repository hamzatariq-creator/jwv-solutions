<!--
  CANONICAL <head> partial — paste into every page.
  Replace the title, meta description, og:url, and og:title per page.
  Keep CSS link order.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<meta name="format-detection" content="telephone=no">

<!-- Theme bootstrap — runs before paint to avoid theme flash -->
<script>(function(){try{var s=localStorage.getItem('jwv-theme');var pref=s||'dark';if(pref==='light'){document.documentElement.classList.add('paper');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#F6F4EF');}}catch(e){}})();</script>

<title>JWV Solutions — Operating partners across three industrial businesses</title>
<meta name="description" content="JWV Solutions is the parent of Altaris Industrial, ARTech Lubricants, and Michaelson Fluid Power — three independent operating companies serving industrial, defense, marine, and aerospace customers from the US Northeast.">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="JWV Solutions">
<meta property="og:url" content="https://jwv-solutions.com/">
<meta property="og:title" content="JWV Solutions — Operating partners across three industrial businesses">
<meta property="og:description" content="Parent company of Altaris Industrial, ARTech Lubricants, and Michaelson Fluid Power.">
<meta property="og:image" content="https://jwv-solutions.com/assets/images/og/og-default.jpg">
<meta name="twitter:card" content="summary_large_image">

<!-- Favicon / icons -->
<link rel="icon" type="image/svg+xml" href="/assets/images/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">

<!-- Fonts: Fraunces (serif display) + Inter (sans body) -->

  "@context": "https://schema.org",
