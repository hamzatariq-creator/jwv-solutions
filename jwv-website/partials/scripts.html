<!--
  CANONICAL closing scripts — paste right before </body>.
  GSAP/ScrollTrigger/Lenis are loaded ONLY on the homepage. Inner pages
  use just main.js (which gates motion-heavy modules behind .page-home).
-->

<!-- Homepage only: GSAP + ScrollTrigger + Lenis from CDN -->
<!-- Remove these three <script> tags on inner pages -->
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>

<!-- App entry — module so we can use ESM imports -->
<script type="module" src="/assets/js/main.js"></script>
