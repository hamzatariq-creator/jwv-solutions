<?xml version="1.0" encoding="utf-8"?>
<!-- Parker wordmark. Official Adobe Illustrator artwork, unchanged in geometry:
     the six letterform subpaths below are byte-for-byte the ones from the
     supplied file, and the bar is the same rectangle, at the same coordinates.

     What changed is only how the shape is FILLED. The supplied file was a
     knockout: an opaque white <rect> covering the whole canvas, with a black
     evenodd path painting everything EXCEPT the letters, so the wordmark was a
     hole rather than a shape. The partner strip normalises every logo with
     `filter: brightness(0) invert(1)`, which flattens all pixels to black and
     then inverts them to white, collapsing that file's white ground and black
     surround into one solid white block with no readable wordmark.
     Here the letters and bar are painted positively on a transparent ground,
     which is what the rest of the strip expects. Verified pixel-identical to
     the supplied artwork: 99.9984% of pixels agree at 4x scale, the only
     differences being six antialiasing samples sitting on the threshold.

     The viewBox is also cropped to the artwork's own bounding box
     (0 30.312 244.556 50.416, measured with getBBox). The original 250x95.971
     canvas left the mark filling just 52.5% of its height, so sizing by CSS
     height rendered it far smaller than the other logos. Cropping the empty
     margin is a change of frame, not of geometry. -->
<svg xmlns="http://www.w3.org/2000/svg" width="244.556" height="50.416" viewBox="0 30.312 244.556 50.416" role="img">
  <g fill="#FFFFFF" fill-rule="evenodd" clip-rule="evenodd">
    <rect x="0" y="45.906" width="73.525" height="11.437"/>
    <path d="M219.317,66.948v-9.605c0,0,1.991-12.894-15.61-11.99 c-17.246-0.53-16.716,8.716-16.891,18.139c0,10.36,1.812,17.616,15.609,17.06c14.52,0,16.892,0,16.892,0V69.138h-16.892V56.443 h2.365v10.506H219.317 M154.314,30.838v49.89h14.168V68.406l6.176,12.146h15.789l-10.54-17.959l9.804-16.862h-15.053l-6.352,11.963 V30.838H154.314z M244.556,45.731v11.795h-8.167v23.025h-14.348V55.337c0,0,0.176-9.606,10.716-9.606H244.556z M152.318,45.731 v11.795h-8.167v23.025h-14.345V55.337c0,0,0.175-9.606,10.713-9.606H152.318z M97.68,45.731h18.154c0,0,11.421-0.732,11.421,9.606 c0,10.703,0,25.215,0,25.215H105.85c0,0-12.883,1.641-12.883-10.712c0-11.055,10.336-9.772,12.883-9.772h4.54v10.33h2.724V57.527 H97.68V45.731z M52.824,59.868v20.684h19.618v-9.071h4.713c0,0,18.709,0.907,18.709-20.134c0-21.417-14.698-21.035-19.063-21.035 c-4.36,0-23.978,0-23.978,0v13.05h23.245v16.506H52.824z"/>
  </g>
</svg>
